<!DOCTYPE html>
<html>
<head>
    <title>Factorial</title>
</head>
<body>
    <h2>Factorial of a Number</h2>

    <script>
        let n = parseInt(prompt("Enter a number:"));
        let fact = 1;

        for (let i = 1; i <= n; i++) {
            fact = fact * i;
        }

        document.write("Factorial of " + n + " is " + fact);
    </script>
</body>
</html>
